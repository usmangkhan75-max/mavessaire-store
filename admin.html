<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAVESSAIRE — Demo Order Desk</title><link rel="stylesheet" href="styles.css"><style>.admin{max-width:1100px;margin:55px auto;padding:0 24px}.admin h1{font:500 48px 'Cormorant Garamond'}.admin button{padding:12px 16px;border:1px solid var(--line);background:transparent;font-size:10px;letter-spacing:1px}.admin table{width:100%;border-collapse:collapse;background:#faf8f3;margin-top:25px}.admin td,.admin th{text-align:left;padding:13px;border-bottom:1px solid var(--line);font-size:11px}.notice{background:#e8e0d2;padding:15px;font-size:11px;line-height:1.7}@media(max-width:700px){.admin table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><div class="announcement">MAVESSAIRE · INTERNAL DEMO ORDER DESK</div><header class="site-header"><a class="wordmark" href="index.html">MAVESSAIRE<span>MAISON DE PARFUM</span></a><a href="index.html">← RETURN TO STORE</a></header><main class="admin"><p class="eyebrow">LOCAL BROWSER DATA ONLY</p><h1>Order <em>desk.</em></h1><button id="refresh">REFRESH</button> <button id="export">EXPORT CSV ↓</button><button id="clear">CLEAR DEMO ORDERS</button><p class="notice">Demo limitation: this page only sees orders saved in localStorage in this same browser. It is not a secure admin system and cannot receive orders from other customers or devices.</p><div id="orders"></div></main><script>const money=n=>'PKR '+Number(n).toLocaleString('en-PK'),get=()=>JSON.parse(localStorage.getItem('mavessaire-orders')||'[]');function render(){let a=get();document.getElementById('orders').innerHTML=a.length?'<table><thead><tr><th>REFERENCE</th><th>DATE</th><th>CUSTOMER</th><th>PHONE</th><th>PAYMENT</th><th>TOTAL</th><th>STATUS</th></tr></thead><tbody>'+a.slice().reverse().map(o=>'<tr><td>'+o.ref+'</td><td>'+new Date(o.created).toLocaleString()+'</td><td>'+o.customer.name+'</td><td>'+o.customer.phone+'</td><td>'+o.customer.payment+'</td><td>'+money(o.total)+'</td><td>'+o.status+'</td></tr>').join('')+'</tbody></table>':'<p>No demo orders in this browser yet.</p>'}document.getElementById('refresh').onclick=render;document.getElementById('export').onclick=()=>{let rows=[['Reference','Created','Name','Phone','Email','Address','City','Payment','Subtotal','Shipping','Total','Status'],...get().map(o=>[o.ref,o.created,o.customer.name,o.customer.phone,o.customer.email,o.customer.address,o.customer.city,o.customer.payment,o.subtotal,o.shipping,o.total,o.status])],csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='mavessaire-demo-orders.csv';a.click();URL.revokeObjectURL(a.href)};document.getElementById('clear').onclick=()=>{if(confirm('Delete all demo orders from this browser?')){localStorage.removeItem('mavessaire-orders');render()}};render();</script></body></html>
